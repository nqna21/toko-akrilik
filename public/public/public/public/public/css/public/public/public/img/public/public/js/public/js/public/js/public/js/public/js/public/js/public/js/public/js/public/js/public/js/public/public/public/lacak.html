<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lacak pesanan</title>
<meta name="description" content="Lacak status pesanan dengan kode pesanan dan 4 digit terakhir nomor WhatsApp.">
<meta name="theme-color" content="#0E1A2B">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="top"></div>
<main id="main" class="wrap">
<div class="crumb"><a href="/">Beranda</a> / Lacak pesanan</div>
<section class="sec">
  <h2 style="margin-bottom:1rem">Lacak pesanan</h2>
  <div class="two">
    <form class="box" id="tForm" novalidate>
      <div class="field"><label class="f" for="tCode">Kode pesanan</label><input class="in" id="tCode" placeholder="AKR-XXXXXX" autocomplete="off" autocapitalize="characters" required></div>
      <div class="field"><label class="f" for="tP">4 digit terakhir nomor WhatsApp</label><input class="in" id="tP" inputmode="numeric" maxlength="4" placeholder="7890" autocomplete="off" required></div>
      <div class="err-text" id="tErr" role="alert"></div>
      <button class="btn btn-block" type="submit">Lacak pesanan</button>
    </form>
    <div id="tOut" aria-live="polite"><div class="empty"><b>Masukkan kode pesanan</b>Kodenya ada di halaman setelah checkout dan di pesan WhatsApp dari kami.</div></div>
  </div>
</section></main>
<div id="foot"></div>
<script type="module" src="/js/page-lacak.js"></script>
</body>
</html>
